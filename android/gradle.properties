# A máquina tem 7,6 GB de RAM: pedir -Xmx8G + 4G de metaspace fazia a JVM
# morrer JÁ NA RESERVA de memória ("Gradle build daemon disappeared"), antes
# mesmo de compilar. Teto bem abaixo do físico, deixando folga pro SO.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError

# Aqui o gargalo não é só o heap: cada JVM extra custa memória. Estas três
# linhas evitam processos paralelos — o Kotlin compila DENTRO do daemon do
# Gradle em vez de subir a própria JVM.
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
